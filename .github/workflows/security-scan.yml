# Dogfooding: scan this project's own source with reposcan and publish SARIF.
# Uses `pull_request` (never `pull_request_target`) so untrusted fork code runs with a read-only
# token and no secrets. SARIF upload needs security-events: write, so it is skipped for forks and
# for Dependabot (whose token is read-only).
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, picks up new advisories

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # upload-sarif looks up the workflow run (required on private repositories)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, for the history scan below
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install reposcan and pinned scanners
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --frozen
          uv pip install "semgrep==1.181.0"
          GOBIN="${RUNNER_TEMP}/bin" go install \
            -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" \
            github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Secret scan of the whole tree (synthetic fixtures are allow-listed by policies/selfscan.toml)
        run: |
          reposcan scan . \
            --config policies/selfscan.toml \
            --scanners gitleaks \
            --fail-on high \
            --output-dir "${RUNNER_TEMP}/reposcan/secrets" \
            --format json,sarif,md \
            --github-annotations --github-summary
      - name: Secret scan of the full git history (push and schedule only)
        # Not on pull requests: `--history` runs git over repository data, which a fork controls.
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          reposcan scan . \
            --history \
            --config policies/selfscan.toml \
            --scanners gitleaks \
            --fail-on high \
            --output-dir "${RUNNER_TEMP}/reposcan/history" \
            --format json,md
      - name: SAST of the package source (the demo fixtures are intentionally vulnerable)
        if: ${{ always() }}
        run: |
          reposcan scan src \
            --scanners semgrep \
            --fail-on high \
            --output-dir "${RUNNER_TEMP}/reposcan/sast" \
            --format json,sarif,md \
            --github-annotations --github-summary
      - name: Upload secret-scan SARIF to code scanning
        if: ${{ always() && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/reposcan/secrets/reposcan.sarif
          category: reposcan-secrets
      - name: Upload SAST SARIF to code scanning
        if: ${{ always() && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/reposcan/sast/reposcan.sarif
          category: reposcan-sast
      - name: Upload redacted reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reposcan-reports
          path: ${{ runner.temp }}/reposcan/
          retention-days: 14
          if-no-files-found: ignore
