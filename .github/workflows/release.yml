# Protected release: build is unprivileged; publishing needs the `release` environment, which
# must be configured with required reviewers and a tag-protection rule for v* tags.
#
# Rehearsal: "Run workflow" (workflow_dispatch) on any branch runs the same build, uploads the
# artifact, downloads it again and verifies its checksums, but never publishes. Use it to check
# the pipeline (including action upgrades) without cutting a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify the tag matches the package version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} != package version v{version}"
          PY
      - name: Test, then build
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --frozen --extra dev
          uv run --frozen pytest
          uv build
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  rehearsal:
    # workflow_dispatch only: proves the artifact round-trips and the checksums verify. Publishes nothing.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums and contents
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          ls -l
          test "$(ls -1 *.whl | wc -l)" -eq 1 && test "$(ls -1 *.tar.gz | wc -l)" -eq 1

  publish:
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release # required reviewers gate this job
    permissions:
      contents: write # create the GitHub release; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums before publishing
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Create the release (assets are checksummed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
